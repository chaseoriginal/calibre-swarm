services:
  calibre:
    image: linuxserver/calibre:latest
    container_name: calibre-swarm
    security_opt:
    - seccomp:unconfined
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    - PASSWORD=
    - CLI_ARGS=
    volumes:
    - calibre-swarm_config:/config
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
      mode: host
    - target: 8082
      published: 8082
      protocol: tcp
      mode: host
    - target: 8181
      published: 8181
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  calibre-swarm_config:
    name: calibre-swarm_config
